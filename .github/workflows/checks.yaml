---
name: checks

"on":
  pull_request:
    branches:
      - main
permissions:
  contents: read
  pull-requests: write

jobs:
  conventional-commits:
    uses: broadinstitute/shared-workflows/.github/workflows/conventional-commit.yaml@v6
  pre-commit:
    uses: broadinstitute/shared-workflows/.github/workflows/pre-commit.yaml@v6
  static-analysis:
    uses: broadinstitute/shared-workflows/.github/workflows/puppet-lint.yaml@v6
  unit-tests:
    uses: broadinstitute/shared-workflows/.github/workflows/puppet-unit-test.yaml@v6
